<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#080D0A">

    <title>Bale Exchange</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="orders.css">

    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
</head>

<body>

    <main class="app">

        <!-- هدر -->
        <header class="header">

            <button
                class="header-icon"
                id="refreshButton"
                aria-label="تازه‌سازی سفارش‌ها"
            >
                ↻
            </button>

            <div class="brand">
                <span class="brand-gem">💎</span>
                <span>Bale Exchange</span>
            </div>

            <div class="balance-box">
                <span>🪙</span>
                <strong id="userBalance">---</strong>
            </div>

        </header>


        <!-- عنوان صفحه -->
        <section class="home-heading">

            <div>
                <h1>سفارش‌های فعال</h1>

                <p>
                    عضو کانال شو و پاداش بگیر
                </p>
            </div>

            <span class="live-indicator">
                <i></i>
                زنده
            </span>

        </section>


        <!-- فهرست سفارش‌ها -->
        <section
            class="orders-list"
            id="ordersContainer"
        >

            <div class="loading-box">

                <div class="loading-spinner"></div>

                <p>
                    در حال دریافت سفارش‌ها...
                </p>

            </div>

        </section>


        <!-- وضعیت سفارش‌ها -->
        <p
            class="status-text"
            id="orderCount"
        >
            در حال بارگذاری...
        </p>


        <!-- منوی پایین -->
        <nav class="bottom-nav">

            <button
                class="nav-item active"
                data-page="home"
            >
                <span class="nav-icon">⌂</span>
                <small>خانه</small>
            </button>

            <button
                class="nav-item"
                data-page="orders"
            >
                <span class="nav-icon">☷</span>
                <small>سفارش‌ها</small>
            </button>

            <button
                class="nav-item"
                data-page="wallet"
            >
                <span class="nav-icon">▱</span>
                <small>کیف پول</small>
            </button>

            <button
                class="nav-item"
                data-page="profile"
            >
                <span class="nav-icon">♙</span>
                <small>حساب کاربری</small>
            </button>

        </nav>

    </main>


    <!-- اعلان دریافت پاداش -->
    <div
        class="reward-toast"
        id="rewardToast"
        role="status"
        aria-live="polite"
    >

        <span class="toast-icon">✓</span>

        <div>
            <strong>پاداش دریافت شد!</strong>
            <p id="toastMessage"></p>
        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
